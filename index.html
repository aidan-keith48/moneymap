<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moneymap</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one gold income hub in the middle, expense circles orbiting it on elliptical rings, tap a circle and it morphs into a rounded card. Single dark theme by choice. */
:root{
  color-scheme:dark;
  --bg:#08080a;
  --panel:#13120f;
  --ink:#f3efe6;
  --mute:#8f8a7e;
  --line:#2b2923;
  --gold:#e3b93c;
  --good:#79d69b;
  --bad:#ff7d6e;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#stage{position:fixed;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  background:radial-gradient(circle,#1d1c18 1px,transparent 1.2px) 0 0/26px 26px,var(--bg)}
#stage:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.flow{stroke-dasharray:1.5 16;stroke-linecap:round;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-17.5}}

.node{position:absolute;border-radius:50%;cursor:pointer;transition:transform .18s ease}
.node:hover{transform:scale(1.05)}
.node:active{transform:scale(.97)}
.node .in{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:8px;text-align:center;background:#0e0d0b;border:2px solid var(--c);
  box-shadow:0 0 0 0 var(--c);animation:float 7s ease-in-out infinite;animation-delay:var(--d)}
.node:hover .in{box-shadow:0 0 30px -8px var(--c)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.node.dragging{transform:scale(1.08);cursor:grabbing;z-index:3}
.node.dragging .in{animation-play-state:paused;box-shadow:0 18px 36px -8px #000,0 0 34px -6px var(--c)}
.n-title{font-size:12px;font-weight:600;line-height:1.15;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.n-amt{font-family:var(--display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;color:var(--c)}
.node.ex .in{border-style:dashed}
.node:not(.hub) .n-left{font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.hub .in{background:radial-gradient(circle at 50% 35%,#2a2208,#0e0d0b 70%);border-width:3px}
.hub .n-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hub .n-amt{font-size:21px;color:var(--ink)}
.hub .n-left{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;white-space:pre-line;line-height:1.3}

.bar{position:fixed;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right));pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
#top{top:max(14px,env(safe-area-inset-top))}
#bottom{bottom:max(14px,env(safe-area-inset-bottom))}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand i{color:var(--gold);font-style:normal}
.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#141310;display:grid;place-items:center;font-size:18px}
.round:hover{border-color:var(--mute)}
.tools{display:flex;gap:8px}
.pill{flex:1;max-width:520px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#121110ee;border-radius:30px;padding:8px 8px 8px 18px;backdrop-filter:blur(8px)}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-width:0}
.stat small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.stat b{display:block;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{width:46px;height:46px;border-radius:50%;border:0;background:var(--gold);color:#17130a;font-size:26px;line-height:1;font-weight:500;flex:none}
.add:hover{filter:brightness(1.1)}
.seg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:2px;padding:3px;border:1px solid var(--line);background:#121110ee;border-radius:24px;backdrop-filter:blur(8px)}
.seg button{height:34px;border:0;border-radius:17px;padding:0 14px;background:transparent;color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--gold);color:#17130a}
@media (max-width:519px){.seg{top:56px;transform:translateX(-50%)}}
#notice{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 76px);z-index:6;display:none;
  align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 10px;width:max-content;max-width:calc(100% - 32px);padding:8px 8px 8px 16px;
  border:1px solid var(--line);background:#121110ee;border-radius:24px;font-size:13px;backdrop-filter:blur(8px)}
#notice.show{display:flex}
#notice .btn{height:32px;padding:0 12px;font-size:13px}
#hint{position:fixed;left:0;right:0;top:62%;text-align:center;color:var(--mute);font-size:14px;pointer-events:none;display:none;padding:0 24px}

/* card */
#scrim{position:fixed;inset:0;background:#000a;opacity:0;transition:opacity .35s ease;z-index:20}
#card{position:fixed;z-index:21;background:var(--panel);border:2px solid var(--c,var(--gold));overflow:hidden;
  transition:left .42s cubic-bezier(.2,.8,.2,1),top .42s cubic-bezier(.2,.8,.2,1),width .42s cubic-bezier(.2,.8,.2,1),height .42s cubic-bezier(.2,.8,.2,1),border-radius .42s cubic-bezier(.2,.8,.2,1),opacity .3s ease,transform .3s ease;
  box-shadow:0 30px 80px -20px #000}
.cbody{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity .25s ease .18s}
.cbody.show{opacity:1}
.chead{display:flex;align-items:center;gap:10px;padding:16px 14px 6px 20px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.title-in{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed transparent;font-family:var(--display);font-weight:700;font-size:22px;padding:4px 0}
.title-in:hover,.title-in:focus{border-bottom-color:var(--line)}
h2.title-in{margin:0}
.x{width:36px;height:36px;border-radius:50%;border:0;background:#1d1c18;font-size:16px;flex:none}
.x:hover{background:#27251f}
.sum{padding:2px 20px 12px}
.total{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--c)}
.sub{color:var(--mute);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.list{flex:1;overflow:auto;padding:4px 14px 8px 20px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.row{display:grid;grid-template-columns:1fr 92px 64px 30px;gap:6px;align-items:center}
.f{width:100%;min-width:0;height:38px;background:#1a1915;border:1px solid var(--line);border-radius:12px;padding:0 10px;font-size:14px}
.f:focus{border-color:var(--c,var(--gold));outline:0}
.f.num{text-align:right;font-variant-numeric:tabular-nums}
select.f{padding:0 4px;appearance:none;text-align:center;background:#1a1915}
.del{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--mute);font-size:16px}
.del:hover{color:var(--bad)}
.rate{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);padding:0 4px 4px 4px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.rate .f{width:88px;height:30px;border-radius:10px;text-align:right}
.rate .conv{margin-left:auto;color:var(--ink);font-weight:600}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.cfoot{display:flex;gap:8px;padding:12px 14px 16px 20px;border-top:1px solid var(--line);align-items:center}
.btn{height:40px;border-radius:20px;padding:0 16px;border:1px solid var(--line);background:#1a1915;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--mute)}
.btn.main{background:var(--c,var(--gold));border-color:transparent;color:#14110a}
.btn.danger{margin-left:auto;color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#1a0a07;border-color:transparent}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.note{font-size:12px;color:var(--mute);line-height:1.45}
.srow{display:grid;grid-template-columns:84px 14px 1fr 30px;gap:6px;align-items:center}
.srow span{color:var(--mute);text-align:center}
/* net worth cards */
.hold{padding-bottom:12px;border-bottom:1px solid #1f1d19}
.hold:last-child{border-bottom:0}
.sub2{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);padding:0 4px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.sub2 .f{width:96px;height:30px;border-radius:10px}
.sub2 .f.w64{width:64px}
.ro{display:flex;align-items:center;justify-content:flex-end;background:#141310;overflow:hidden;white-space:nowrap;font-size:13px}
.mini{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.mini button{height:28px;border:0;background:transparent;color:var(--mute);font-size:12px;font-weight:600;padding:0 10px}
.mini button[aria-pressed=true]{background:#2a2820;color:var(--ink)}
.stale{color:#f2a14b}
.f.stale{border-color:#f2a14b;color:#f2a14b}
.up{color:var(--good)}
.down{color:var(--bad)}
.gain{font-weight:600}
.exnote{border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border:1px solid var(--line);background:#1a1915;border-radius:14px;text-align:left;font-size:13px;font-weight:600;line-height:1.2}
.chip:hover{border-color:var(--c)}
.linkbtn{height:30px;border-radius:15px;padding:0 12px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#1a1915;margin-left:auto}
.linkbtn:hover{border-color:var(--mute)}
.linkbtn.on{color:var(--good);border-color:#2f4a38}
.f:disabled{opacity:.6}
.tfsa{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:#171612}
.tf-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.tf-row b{color:var(--ink);font-size:14px}
.tf-in{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf-field{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mute)}
.prog{height:8px;border-radius:4px;background:#24221d;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--c);border-radius:4px;transition:width .3s ease}
.prog.over i{background:var(--bad)}
.tf-room{font-size:13px;font-weight:600}
.brk{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;font-size:14px}
.brk b{font-weight:600;font-variant-numeric:tabular-nums}

@media (max-width:420px){.stat b{font-size:13px}.pill{padding-left:14px}}
@media (max-width:519px){.node.ex .n-title{-webkit-line-clamp:1}}
@media (prefers-reduced-motion:reduce){
  .node .in,.flow{animation:none}
  #card,.cbody,#scrim,.node{transition-duration:.01s;transition-delay:0s}
}
</style>
</head>
<body>
<div id="stage"><div id="world"><svg id="lines"></svg></div></div>
<div id="hint">Tap + to add your first expense circle.</div>
<div id="notice" role="status"></div>

<div class="bar" id="top">
  <div class="brand">money<i>map</i></div>
  <div class="seg" role="group" aria-label="View">
    <button id="m-budget" aria-pressed="true">Budget</button>
    <button id="m-worth" aria-pressed="false">Net worth</button>
  </div>
  <div class="tools">
    <button class="round" id="fit" aria-label="Fit map to screen" title="Fit to screen">⤢</button>
    <button class="round" id="gear" aria-label="Settings" title="Currency and data">⚙</button>
  </div>
</div>
<div class="bar" id="bottom">
  <div class="pill">
    <div class="stats">
      <div class="stat"><small id="l-in">In</small><b id="s-in"></b></div>
      <div class="stat"><small id="l-out">Out</small><b id="s-out"></b></div>
      <div class="stat"><small id="l-left">Left</small><b id="s-left"></b></div>
    </div>
    <button class="add" id="add" aria-label="Add expense circle" title="Add expense circle">+</button>
  </div>
</div>

<script>
/* ---------- data ---------- */
const KEY='moneymap.v1';
const GOLD='#e3b93c';
const PALETTE=['#5fd1c4','#ff8a6b','#a58bff','#6bb7ff','#b5e36a','#ff7fb0','#f2a14b','#8ee0a6'];
const uid=()=>Math.random().toString(36).slice(2,9);
const item=(name,amount,cur,rate)=>({id:uid(),name,amount,cur,rate:rate??null});
// net worth: an asset holding (simple value, or units × price) and a liability
const hold=(name,o)=>({id:uid(),name,cur:'ZAR',rate:null,mode:'simple',value:0,qty:0,price:0,priced:null,cost:null,...o});
const debt=(name,o)=>({id:uid(),name,cur:'ZAR',rate:null,balance:0,apr:null,payment:null,...o});
// calm colours for assets, warm colours for liabilities
const ASSET_PRESETS=[
  {kind:'stocks',title:'Stocks and ETFs',color:'#6bb7ff',units:true},
  {kind:'tfsa',title:'Tax-free savings',label:'Tax-free savings (TFSA)',color:'#5fd1c4'},
  {kind:'ra',title:'Retirement annuity',color:'#8ea2ff'},
  {kind:'pension',title:'Pension or provident fund',color:'#b49cff'},
  {kind:'crypto',title:'Crypto',color:'#56c8e8',units:true},
  {kind:'cash',title:'Cash and savings',color:'#8ee0a6'},
  {kind:'property',title:'Property',color:'#b5e36a'},
  {kind:'other',title:'Other assets',label:'Other',color:'#a9c2d6'}
];
const DEBT_PRESETS=[
  {kind:'home',title:'Home loan',color:'#ff8a6b'},
  {kind:'vehicle',title:'Vehicle finance',color:'#f2a14b'},
  {kind:'card',title:'Credit card',color:'#ff6f7d'},
  {kind:'student',title:'Student loan',color:'#ff7fb0'},
  {kind:'other',title:'Other debts',label:'Other',color:'#e9967a'}
];
const VERSION=2;
const TFSA_LIMITS={annual:46000,lifetime:500000};

function sample(){
  return {
    base:'ZAR',
    rates:{USD:18.2,EUR:21.0,GBP:24.0},
    income:[item('Salary',42000,'ZAR'),item('Side project',3500,'ZAR')],
    nodes:[
      {id:uid(),title:'Subscriptions',color:PALETTE[0],items:[item('Claude Code',100,'USD'),item('Netflix',199,'ZAR'),item('Spotify',69,'ZAR')]},
      {id:uid(),title:'Tech',color:PALETTE[1],items:[item('Hosting',12,'USD'),item('Domain',14,'USD'),item('Cloud storage',60,'ZAR')]},
      {id:uid(),title:'Health insurance',color:PALETTE[2],items:[item('Medical aid',3200,'ZAR')]},
      {id:uid(),title:'Life insurance',color:PALETTE[3],items:[item('Life cover',650,'ZAR')]},
      {id:uid(),title:'Data',color:PALETTE[4],items:[item('Fibre',899,'ZAR'),item('Mobile data',349,'ZAR')]},
      {id:uid(),title:'Living',color:PALETTE[5],items:[item('Rent',9500,'ZAR'),item('Groceries',4500,'ZAR')]}
    ]
  };
}
let S;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- money maths: pure functions, no DOM and no global state ---------- */
// fx is {base, rates}; dates are 'YYYY-MM-DD' strings so results never depend on the clock.
const Money=(()=>{
  const n=v=>{const x=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(x)?x:0};
  const fxRate=(cur,override,fx)=>cur===fx.base?1:(override>0?override:(fx.rates[cur]||1));
  const toBase=(amount,cur,override,fx)=>n(amount)*fxRate(cur,override,fx);
  const holdingValue=h=>h.mode==='units'?n(h.qty)*n(h.price):n(h.value); // in the holding's own currency
  const holdingBase=(h,fx)=>holdingValue(h)*fxRate(h.cur,h.rate,fx);
  const debtBase=(d,fx)=>toBase(d.balance,d.cur,d.rate,fx);
  const gain=(h,fx)=>{
    const cost=n(h.cost);if(!(cost>0))return null;
    const r=fxRate(h.cur,h.rate,fx),value=holdingValue(h)*r,c=cost*r;
    return {cost:c,value,gain:value-c,pct:(value-c)/c*100};
  };
  const gainTotal=(hs,fx)=>{
    let cost=0,g=0,any=false;
    for(const h of hs){const x=gain(h,fx);if(x){any=true;cost+=x.cost;g+=x.gain}}
    return any?{cost,gain:g,pct:g/cost*100}:null;
  };
  const circleTotal=(c,side,fx)=>c.items.reduce((a,i)=>a+(side==='a'?holdingBase(i,fx):debtBase(i,fx)),0);
  const netWorth=(assets,debts,fx)=>{
    const a=assets.reduce((s,c)=>s+circleTotal(c,'a',fx),0),l=debts.reduce((s,c)=>s+circleTotal(c,'d',fx),0);
    return {assets:a,liabilities:l,net:a-l};
  };
  const dayNum=iso=>{const [y,m,d]=String(iso).split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
  const ageDays=(iso,today)=>dayNum(today)-dayNum(iso);
  const isStale=(iso,today,days=30)=>!iso||!(ageDays(iso,today)<=days);
  // South African tax year: 1 March to the end of February
  const taxYear=today=>{
    const [y,m]=String(today).split('-').map(Number),s=m>=3?y:y-1,e=s+1;
    const leap=e%4===0&&(e%100!==0||e%400===0);
    return {start:s,from:`${s}-03-01`,to:`${e}-02-${leap?29:28}`,label:`${s}/${String(e).slice(2)}`};
  };
  const tfsa=(year,life,lim)=>{
    year=Math.max(0,n(year));life=Math.max(0,n(life));
    const A=n(lim.annual),L=n(lim.lifetime);
    const yearLeft=Math.max(0,A-year),lifeLeft=Math.max(0,L-life);
    return {yearPct:A>0?Math.min(100,year/A*100):0,lifePct:L>0?Math.min(100,life/L*100):0,
      yearLeft,lifeLeft,room:Math.min(yearLeft,lifeLeft),overYear:year>A,overLife:life>L};
  };
  return {num:n,fxRate,toBase,holdingValue,holdingBase,debtBase,gain,gainTotal,circleTotal,netWorth,dayNum,ageDays,isStale,taxYear,tfsa};
})(); // MONEY-END

/* ---------- money formatting ---------- */
const SYM={ZAR:'R',USD:'$',EUR:'€',GBP:'£'};
const sym=c=>SYM[c]||(c+' ');
const num=Money.num;
function fmt(n){const r=Math.round(n*100)/100;return r.toLocaleString('en-US',{minimumFractionDigits:r%1?2:0,maximumFractionDigits:2})}
const money=n=>(n<0?'−':'')+sym(S.base)+fmt(Math.abs(n));
function compact(n){
  const a=Math.abs(n),s=(n<0?'−':'')+sym(S.base);
  if(a>=1e6)return s+(a/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(a>=1e4)return s+(a/1e3).toFixed(1).replace(/\.0$/,'')+'k';
  return s+Math.round(a).toLocaleString('en-US');
}
const nat=(v,cur)=>(v<0?'−':'')+sym(cur)+fmt(Math.abs(v)); // an amount in its own currency
const signed=n=>(n>=0?'+':'−')+sym(S.base)+fmt(Math.abs(n));
const pctS=p=>(p>=0?'+':'−')+Math.abs(p).toFixed(1)+'%';
const fmtPct=p=>(Math.round(p*10)/10)+'%';
const inBase=it=>Money.toBase(it.amount,it.cur,it.rate,S);
const sum=items=>items.reduce((a,i)=>a+inBase(i),0);
const incomeTotal=()=>sum(S.income);
const spentTotal=()=>S.nodes.reduce((a,n)=>a+sum(n.items),0);
const allItems=()=>[S.income,...S.nodes.map(n=>n.items),...S.worth.assets.map(c=>c.items),...S.worth.debts.map(c=>c.items)].flat();

/* ---------- dates ---------- */
const isoOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO=()=>isoOf(new Date());
const addDays=(iso,k)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+k);return isoOf(d)};
const fmtDate=iso=>new Date(iso+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

/* ---------- state version and migration ---------- */
function emptyWorth(){return {assets:[],debts:[],offsets:{},snapshots:[],lastPrompt:null}}
// Invented South African figures, flagged ex:true so "Clear examples" can remove them.
function exampleWorth(){
  const t=todayISO(),ago=k=>addDays(t,-k);
  const A=(kind,items,extra)=>{const p=ASSET_PRESETS.find(x=>x.kind===kind);return {id:uid(),title:p.title,kind,color:p.color,ex:true,items,...extra}};
  const D=(kind,items)=>{const p=DEBT_PRESETS.find(x=>x.kind===kind);return {id:uid(),title:p.title,kind,color:p.color,ex:true,items}};
  const assets=[
    A('stocks',[hold('Satrix Top 40 ETF',{mode:'units',qty:120,price:92.4,priced:ago(12),cost:9800}),
      hold('Global tech ETF',{cur:'USD',mode:'units',qty:15,price:64.1,priced:ago(45),cost:820})]),
    A('tfsa',[hold('Tax-free ETF',{value:128000,cost:105000})],{tfsa:{year:18000,life:105000,ty:Money.taxYear(t).start}}),
    A('ra',[hold('Retirement annuity fund',{value:186500})]),
    A('pension',[hold('Employer provident fund',{value:312000})]),
    A('crypto',[hold('Bitcoin',{mode:'units',qty:0.045,price:1750000,priced:ago(3),cost:52000})]),
    A('cash',[hold('Emergency fund',{value:45000}),hold('Everyday account',{value:8200})]),
    A('property',[hold('Flat in Pinelands',{value:1450000,cost:1180000})])
  ];
  const debts=[
    D('home',[debt('Bond',{balance:1120000,apr:11.25,payment:12850})]),
    D('vehicle',[debt('Car finance',{balance:168000,apr:12.9,payment:4950})]),
    D('card',[debt('Credit card',{balance:7400,apr:20.75,payment:1200})]),
    D('student',[debt('Study loan',{balance:24000,apr:9.5,payment:850})])
  ];
  const snapshots=[];
  for(let k=6;k>=1;k--){
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-k);
    const liabilities=1319400+k*9200,net=Math.round(917600*(1-k*.018)+(k%2?6500:-4200));
    snapshots.push({id:uid(),date:isoOf(d),assets:net+liabilities,liabilities,net,circles:[],ex:true});
  }
  return {...emptyWorth(),assets,debts,snapshots};
}
function migrate(s){
  if(!s||typeof s!=='object'||!Array.isArray(s.nodes))return null;
  if(!(s.v>=2)){
    // v1 to v2: budget fields (base, rates, income, nodes, offsets) are left exactly as they were
    s.v=VERSION;s.mode='budget';s.privacy=false;s.tfsaLimits={...TFSA_LIMITS};s.worth=exampleWorth();
  }
  s.worth=Object.assign(emptyWorth(),s.worth);
  s.tfsaLimits=Object.assign({...TFSA_LIMITS},s.tfsaLimits);
  if(s.mode!=='worth')s.mode='budget';
  s.privacy=s.privacy===true;
  if(!Array.isArray(s.income))s.income=[];
  if(!s.rates||typeof s.rates!=='object')s.rates={};
  return s;
}
{
  let raw=null,stored=null;
  try{raw=localStorage.getItem(KEY);stored=JSON.parse(raw||'null')}catch(e){}
  // keep an untouched copy of v1 data before the first migration, just in case
  if(stored&&Array.isArray(stored.nodes)&&!(stored.v>=2)){try{localStorage.setItem(KEY+'.before-v2',raw)}catch(e){}}
  S=migrate(stored)||migrate(sample());
  save();
}

/* ---------- dom helpers ---------- */
const h=(tag,props={},...kids)=>{
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==='class')e.className=v;
    else if(k==='style')e.style.cssText=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k.startsWith('aria-')){if(v!==undefined&&v!==null)e.setAttribute(k,v)}
    else if(v!==undefined&&v!==null)e[k]=v;
  }
  kids.flat().forEach(c=>e.append(c));
  return e;
};
const $=id=>document.getElementById(id);
const stage=$('stage'),world=$('world'),lines=$('lines');

/* ---------- map ---------- */
let tx=0,ty=0,sc=1,lastKey='',worldW=0,worldH=0;
const els=new Map();
let pts={}; // key -> {ax,ay auto-layout spot; x,y current centre; r}
let curIds=[],padTop=70; // circle ids in line order; top padding of the current layout
// each mode keeps its own dragged positions
const offStore=()=>S.mode==='worth'?S.worth.offsets:(S.offsets||(S.offsets={}));
const offOf=k=>{const o=offStore();return Object.hasOwn(o,k)?o[k]:[0,0]};
function applyView(){world.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`}
function fit(){
  const W=stage.clientWidth,H=stage.clientHeight;
  // the world rectangle, grown to include any circle dragged outside it
  let x0=0,y0=0,x1=worldW,y1=worldH;
  for(const p of Object.values(pts)){
    x0=Math.min(x0,p.x-p.r-8);x1=Math.max(x1,p.x+p.r+8);
    y0=Math.min(y0,p.y-p.r-padTop);y1=Math.max(y1,p.y+p.r+96);
  }
  const bw=x1-x0,bh=y1-y0,grown=bw>worldW+1||bh>worldH+1;
  sc=Math.max(grown?.3:.5,Math.min(1,W/bw,H/bh));
  tx=(W-bw*sc)/2-x0*sc;ty=(H-bh*sc)/2-y0*sc;applyView();
}
function hashDelay(id){let x=0;for(const c of id)x=(x*31+c.charCodeAt(0))>>>0;return -((x%70)/10)+'s'}
function curve(hub,p,ni){
  const dx=p.x-hub.x,dy=p.y-hub.y,len=Math.hypot(dx,dy)||1;
  const sign=ni%2?1:-1,bend=len*.14*sign;
  const qx=(hub.x+p.x)/2+(-dy/len)*bend,qy=(hub.y+p.y)/2+(dx/len)*bend;
  return `M${hub.x} ${hub.y} Q${qx} ${qy} ${p.x} ${p.y}`;
}
function moveNode(key,dx,dy,el){
  const p=pts[key];if(!p)return;
  offStore()[key]=[Math.round(dx*10)/10,Math.round(dy*10)/10];
  p.x=p.ax+dx;p.y=p.ay+dy;
  el.style.left=(p.x-p.r)+'px';el.style.top=(p.y-p.r)+'px';
  // update the existing paths so the flow animation keeps running
  curIds.forEach((id,ni)=>{
    if(key!=='hub'&&id!==key)return;
    const d=curve(pts.hub,pts[id],ni);
    lines.children[2*ni].setAttribute('d',d);lines.children[2*ni+1].setAttribute('d',d);
  });
}

// What the map shows in the current mode: circles, their totals, and the arcs they sit on.
function viewModel(){
  if(S.mode==='worth'){
    const list=[
      ...S.worth.assets.map(c=>({c,kind:'asset',side:'a',total:Money.circleTotal(c,'a',S)})),
      ...S.worth.debts.map(c=>({c,kind:'debt',side:'d',total:Money.circleTotal(c,'d',S)}))];
    const idx=side=>list.map((x,i)=>x.side===side?i:-1).filter(i=>i>=0);
    // assets on the upper arc, liabilities on the lower arc
    return {list,nw:Money.netWorth(S.worth.assets,S.worth.debts,S),cap:stage.clientWidth<520?3:4,capInc:3,
      groups:[{idx:idx('a'),start:-180,span:180},{idx:idx('d'),start:0,span:180}]};
  }
  const list=S.nodes.map(c=>({c,kind:'node',side:'b',total:sum(c.items)}));
  return {list,cap:7,capInc:5,groups:[{idx:list.map((x,i)=>i),start:-90,span:360,full:true}]};
}

function renderMap(){
  const W=stage.clientWidth,H=stage.clientHeight,narrow=W<520,worth=S.mode==='worth';
  padTop=narrow?118:70;const padBot=96; // narrow screens put the mode toggle on its own row
  const V=viewModel(),list=V.list;
  const totals=list.map(x=>x.total);
  const maxV=Math.max(1,...totals);
  const rMin=narrow?34:40,rSpan=narrow?24:32,hubR=narrow?60:72;
  const radii=totals.map(v=>rMin+rSpan*Math.sqrt(Math.max(v,0)/maxV));
  const maxR=Math.max(rMin,...radii);
  const availH=H-padTop-padBot;
  const rx0=Math.max(hubR+maxR+26,W/2-maxR-8);
  const ry0=Math.max(hubR+maxR+26,availH/2-maxR-8);
  const gap=2*maxR+24;
  // each group fills its own arc; a big group spills onto outer rings
  const placed=[];let rings=1;
  for(const g of V.groups){
    let i=0,cap=V.cap,k=0;
    while(i<g.idx.length){placed.push({k,ids:g.idx.slice(i,i+cap),g});i+=cap;cap+=V.capInc;k++}
    rings=Math.max(rings,k);
  }
  const last=rings-1;
  const rxL=rx0+last*gap,ryL=ry0+last*gap;
  worldW=Math.max(W,2*(rxL+maxR+8));
  const innerH=Math.max(availH,2*(ryL+maxR+8));
  worldH=innerH+padTop+padBot;
  const cx=worldW/2,cy=padTop+innerH/2;
  world.style.width=worldW+'px';world.style.height=worldH+'px';
  lines.setAttribute('width',worldW);lines.setAttribute('height',worldH);

  const pos={};
  const prevN=new Map();
  for(const {k,ids,g} of placed){
    const n=ids.length,n0=prevN.get(g)||n;prevN.set(g,n);
    let angle;
    if(g.full){const step=360/n,off=k%2?step/2:0;angle=j=>g.start+off+step*j} // the original budget layout
    else if(k%2&&n<n0){const step=g.span/n0,skip=Math.floor((n0-1-n)/2);angle=j=>g.start+step*(j+1+skip)} // sit in the inner ring's gaps
    else if(k%2){const step=g.span/(n+1);angle=j=>g.start+step*(j+1)}
    else{const step=g.span/n;angle=j=>g.start+step*(j+.5)}
    ids.forEach((ni,j)=>{
      const a=angle(j)*Math.PI/180;
      pos[ni]=[cx+Math.cos(a)*(rx0+k*gap),cy+Math.sin(a)*(ry0+k*gap)];
    });
  }

  // current positions: auto-layout spot plus any saved drag offset
  pts={};
  const pt=(key,ax,ay,r)=>{const [dx,dy]=offOf(key);return pts[key]={ax,ay,x:ax+dx,y:ay+dy,r}};
  pt('hub',cx,cy,hubR);
  list.forEach((x,ni)=>pt(x.c.id,pos[ni][0],pos[ni][1],radii[ni]));
  curIds=list.map(x=>x.c.id);

  // lines, thicker for bigger values
  let svg='';
  list.forEach((x,ni)=>{
    const d=curve(pts.hub,pts[x.c.id],ni);
    const w=1.5+5*Math.sqrt(Math.max(totals[ni],0)/maxV);
    svg+=`<path d="${d}" fill="none" stroke="${x.c.color}" stroke-opacity=".28" stroke-width="${w.toFixed(1)}" stroke-linecap="round"/>`;
    svg+=`<path class="flow" d="${d}" fill="none" stroke="${x.c.color}" stroke-width="${(w+1.5).toFixed(1)}"/>`;
  });
  lines.innerHTML=svg;

  // nodes
  const seen=new Set();
  const place=(key,x,y,r,color,title,amt,extra,onTap,cls)=>{
    seen.add(key);
    let el=els.get(key);
    if(!el){
      el=h('div',{class:'node '+(cls||''),onclick:e=>e.currentTarget._tap()},h('div',{class:'in'},h('div',{class:'n-title'}),h('div',{class:'n-amt'}),h('div',{class:'n-left'})));
      el.dataset.key=key;
      world.append(el);els.set(key,el);
    }
    el._tap=onTap;
    el.style.cssText=`left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;`;
    const inn=el.firstChild;
    inn.style.setProperty('--c',color);inn.style.setProperty('--d',hashDelay(key));
    inn.children[0].textContent=title;inn.children[1].textContent=amt;
    inn.children[2].textContent=extra?extra.text:'';
    inn.children[2].style.color=extra?extra.color:'';
    inn.children[1].style.color=cls==='hub'?'':color;
  };
  let stats;
  if(worth){
    const {assets,liabilities,net}=V.nw;
    place('hub',pts.hub.x,pts.hub.y,hubR,GOLD,'Net worth',compact(net),{text:`assets ${compact(assets)}\ndebts ${compact(liabilities)}`,color:'var(--mute)'},()=>openCard({kind:'worth'}),'hub');
    els.get('hub').firstChild.children[1].style.color=net<0?'var(--bad)':'';
    stats=[['Assets',compact(assets),''],['Debts',compact(liabilities),''],['Net worth',compact(net),net<0?'var(--bad)':'var(--good)']];
  }else{
    const inc=incomeTotal(),spent=spentTotal(),left=inc-spent;
    place('hub',pts.hub.x,pts.hub.y,hubR,GOLD,'Income',compact(inc),{text:(left<0?'over by ':'left ')+compact(Math.abs(left)),color:left<0?'var(--bad)':'var(--good)'},()=>openCard({kind:'income'}),'hub');
    stats=[['In',compact(inc),''],['Out',compact(spent),''],['Left',compact(left),left<0?'var(--bad)':'var(--good)']];
  }
  list.forEach((x,ni)=>place(x.c.id,pts[x.c.id].x,pts[x.c.id].y,radii[ni],x.c.color,x.c.title||'Untitled',compact(totals[ni]),
    x.c.ex?{text:'example',color:'var(--mute)'}:null,()=>openCard({kind:x.kind,id:x.c.id})));
  list.forEach(x=>els.get(x.c.id).classList.toggle('ex',!!x.c.ex));
  for(const [k,el] of els)if(!seen.has(k)){el.remove();els.delete(k)}

  // surrounding chrome follows the mode
  $('hint').textContent=worth?'Tap + to add your first asset or debt circle.':'Tap + to add your first expense circle.';
  $('hint').style.display=list.length?'none':'block';
  ['in','out','left'].forEach((id,i)=>{$('l-'+id).textContent=stats[i][0];const b=$('s-'+id);b.textContent=stats[i][1];b.style.color=stats[i][2]});
  $('m-budget').setAttribute('aria-pressed',String(!worth));$('m-worth').setAttribute('aria-pressed',String(worth));
  const add=$('add'),label=worth?'Add asset or debt circle':'Add expense circle';
  add.setAttribute('aria-label',label);add.title=label;
  renderNotice();

  const key=S.mode+':'+list.length;
  if(lastKey!==key){lastKey=key;fit()}
}
function commit(){syncLinks();save();renderMap()}

/* ---------- pan / zoom ---------- */
const ptrs=new Map();let drag=null,moved=false,pinch=null,grab=null;
const clampS=s=>Math.max(.3,Math.min(2.5,s));
function endGrab(){
  if(!grab)return;
  grab.el.classList.remove('dragging');
  if(moved)save();
  grab=null;
}
stage.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    moved=false;
    const el=e.target.closest('.node');
    if(el){const [ox,oy]=offOf(el.dataset.key);grab={key:el.dataset.key,el,x:e.clientX,y:e.clientY,ox,oy};drag=null}
    else drag={x:e.clientX,y:e.clientY,tx,ty};
  }
  else if(ptrs.size===2){
    endGrab(); // a second finger means pinch, even if the first was on a circle
    const [a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:sc,wx:(mx-tx)/sc,wy:(my-ty)/sc};moved=true;drag=null;
  }
});
window.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){
    const [a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    sc=clampS(pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);
    tx=mx-pinch.wx*sc;ty=my-pinch.wy*sc;applyView();
  }else if(grab&&ptrs.size===1){
    const dx=e.clientX-grab.x,dy=e.clientY-grab.y;
    if(!moved&&Math.hypot(dx,dy)>6){moved=true;grab.el.classList.add('dragging')}
    if(moved)moveNode(grab.key,grab.ox+dx/sc,grab.oy+dy/sc,grab.el);
  }else if(drag&&ptrs.size===1){
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!moved&&Math.hypot(dx,dy)>6)moved=true;
    if(moved){tx=drag.tx+dx;ty=drag.ty+dy;applyView()}
  }
});
const endPtr=e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===1){const p=[...ptrs.values()][0];drag={x:p.x,y:p.y,tx,ty}}
  if(ptrs.size===0){endGrab();drag=null;setTimeout(()=>{moved=false},0)}
};
window.addEventListener('pointerup',endPtr);
window.addEventListener('pointercancel',endPtr);
stage.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault()}},true);
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const ns=clampS(sc*Math.exp(-e.deltaY*.0015)),wx=(e.clientX-tx)/sc,wy=(e.clientY-ty)/sc;
  sc=ns;tx=e.clientX-wx*sc;ty=e.clientY-wy*sc;applyView();
},{passive:false});

/* ---------- card (morph from circle to rounded rectangle) ---------- */
let open=null;
function originRect(ref){
  let el=null;
  if(ref.kind==='settings')el=$('gear');
  else if(ref.kind==='add')el=$('add');
  else if(ref.kind==='income'||ref.kind==='worth')el=els.get('hub');
  else el=els.get(ref.id);
  return el?el.getBoundingClientRect():null;
}
function setGeo(card,r,radius){
  card.style.left=r.left+'px';card.style.top=r.top+'px';
  card.style.width=r.width+'px';card.style.height=r.height+'px';card.style.borderRadius=radius;
}
function openCard(ref){
  if(open)closeCard(true);
  const r=originRect(ref)||{left:innerWidth/2-30,top:innerHeight/2-30,width:60,height:60};
  const owner=ref.id&&[...S.nodes,...S.worth.assets,...S.worth.debts].find(n=>n.id===ref.id);
  const color=owner?owner.color:GOLD;
  const body=ref.kind==='settings'?buildSettings():ref.kind==='worth'?buildWorthHub():ref.kind==='add'?buildPicker()
    :ref.kind==='asset'||ref.kind==='debt'?buildWorthCard(ref):buildCard(ref);
  const card=h('div',{id:'card',role:'dialog','aria-modal':'true'},body);
  card.style.setProperty('--c',color);
  const scrim=h('div',{id:'scrim',onclick:()=>closeCard()});
  document.body.append(scrim,card);
  setGeo(card,r,'50%');
  open={card,scrim,ref,body};
  const w=Math.min(innerWidth-24,440),hh=Math.min(innerHeight-40,{settings:640,add:560,worth:680}[ref.kind]||620);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(!open||open.card!==card)return;
    setGeo(card,{left:(innerWidth-w)/2,top:(innerHeight-hh)/2,width:w,height:hh},'28px');
    scrim.style.opacity=1;body.classList.add('show');
  }));
  return body;
}
function closeCard(instant){
  if(!open)return;
  const {card,scrim,ref,body}=open;open=null;
  if(instant){card.remove();scrim.remove();return}
  body.classList.remove('show');scrim.style.opacity=0;
  const r=originRect(ref);
  if(r)setGeo(card,r,'50%');else{card.style.opacity=0;card.style.transform='scale(.9)'}
  setTimeout(()=>{card.remove();scrim.remove()},440);
}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard()});

function buildCard(ref){
  const isInc=ref.kind==='income';
  const node=isInc?null:S.nodes.find(n=>n.id===ref.id);
  const items=isInc?S.income:node.items;
  const total=h('div',{class:'total'});
  const sub=h('div',{class:'sub'});
  const list=h('div',{class:'list'});
  const update=()=>{
    const t=sum(items),inc=incomeTotal();
    total.textContent=money(t);
    sub.replaceChildren(...(isInc
      ?[h('span',{textContent:money(spentTotal())+' spent'}),h('span',{textContent:money(inc-spentTotal())+' left'}),h('span',{textContent:'per month'})]
      :[h('span',{textContent:(inc>0?fmt(t/inc*100)+'% of income':'no income yet')}),h('span',{textContent:money(t*12)+' / year'}),h('span',{textContent:items.length+(items.length===1?' item':' items')})]));
  };
  const changed=()=>{update();commit()};
  const renderRows=()=>{
    list.replaceChildren();
    if(!items.length)list.append(h('div',{class:'empty',textContent:isInc?'Add a salary or any other money coming in.':'Nothing here yet. Add the first item below.'}));
    items.forEach(it=>list.append(rowEl(items,it,changed,renderRows)));
  };
  const title=isInc
    ?h('h2',{class:'title-in',textContent:'Income'})
    :h('input',{class:'title-in',id:'node-title',value:node.title,placeholder:'Title',maxLength:40,'aria-label':'Title',oninput:e=>{node.title=e.target.value;commit()}});
  const addBtn=h('button',{class:'btn main',id:'add-item',textContent:'+ Add item',onclick:()=>{
    const it=item('',0,S.base);items.push(it);renderRows();changed();
    const rows=list.querySelectorAll('.row');const last=rows[rows.length-1];
    if(last){last.scrollIntoView({block:'nearest'});last.querySelector('input').focus()}
  }});
  const foot=h('div',{class:'cfoot'},addBtn);
  if(!isInc){
    let armed=false,timer;
    const del=h('button',{class:'btn danger',id:'del-node',textContent:'Delete circle',onclick:()=>{
      if(!armed){armed=true;del.textContent='Tap again to delete';del.classList.add('armed');timer=setTimeout(()=>{armed=false;del.textContent='Delete circle';del.classList.remove('armed')},2600);return}
      clearTimeout(timer);
      const ref2={kind:'node',id:node.id};
      closeCard();
      S.nodes=S.nodes.filter(n=>n.id!==node.id);if(S.offsets)delete S.offsets[node.id];commit();void ref2;
    }});
    foot.append(del);
  }
  const body=h('div',{class:'cbody'},
    h('div',{class:'chead'},h('span',{class:'dot'}),title,h('button',{class:'x',id:'close',textContent:'✕','aria-label':'Close',onclick:()=>closeCard()})),
    h('div',{class:'sum'},total,sub),list,foot);
  update();renderRows();
  return body;
}

function rowEl(items,it,changed,rerender){
  const wrap=h('div',{class:'row'});
  const conv=h('span',{class:'conv'});
  const rateBox=h('div',{class:'rate'});
  const upd=()=>{conv.textContent='= '+money(inBase(it))};

const linkedItem=id=>{for(const n of S.nodes){const it=n.items.find(i=>i.link===id);if(it)return it}return null};
function addDebtToBudget(d){
  if(linkedItem(d.id))return; // never counted twice
  let n=S.nodes.find(x=>x.debts)||S.nodes.find(x=>x.title.trim().toLowerCase()==='debt repayments');
  if(!n){
    const used=new Set(S.nodes.map(x=>x.color));
    n={id:uid(),title:'Debt repayments',color:PALETTE.find(c=>!used.has(c))||PALETTE[6],items:[]};
    S.nodes.push(n);
  }
  n.debts=true;
  n.items.push({...item(d.name,0,d.cur),link:d.id});
}
function unlinkDebt(id){for(const n of S.nodes)for(let i=n.items.length-1;i>=0;i--)if(n.items[i].link===id)n.items.splice(i,1)}
// Linked budget items mirror their liability's monthly payment. They are removed when the debt,
// or its payment, goes away. Runs on every commit; arrays are changed in place so open cards stay valid.
function syncLinks(){
  const debts=new Map();
  for(const c of S.worth.debts)for(const d of c.items)debts.set(d.id,{d,c});
  const seen=new Set();
  for(const n of S.nodes)for(let i=n.items.length-1;i>=0;i--){
    const it=n.items[i];if(!it.link)continue;
    const x=debts.get(it.link);
    if(!x||!(num(x.d.payment)>0)||seen.has(it.link)){n.items.splice(i,1);continue}
    seen.add(it.link);
    it.name=x.d.name||x.c.title;it.amount=num(x.d.payment);it.cur=x.d.cur;it.rate=x.d.rate??null;
  }
}

function buildWorthCard(ref){
  const side=ref.kind==='asset'?'a':'d',group=side==='a'?S.worth.assets:S.worth.debts;
  const c=group.find(x=>x.id===ref.id),items=c.items;
  const preset=(side==='a'?ASSET_PRESETS:DEBT_PRESETS).find(p=>p.kind===c.kind)||{};
  const total=h('div',{class:'total'}),sub=h('div',{class:'sub'}),list=h('div',{class:'list'});
  const exNote=h('div',{class:'note exnote',id:'ex-note',textContent:'Example figures. Edit anything here and this circle becomes yours. "Clear examples" removes the rest.'});
  let extra=null;
  const update=()=>{
    const today=todayISO(),t=Money.circleTotal(c,side,S),nw=Money.netWorth(S.worth.assets,S.worth.debts,S),parts=[];
    total.textContent=money(t);
    if(side==='a'){
      if(nw.assets>0)parts.push(fmtPct(t/nw.assets*100)+' of assets');
      const g=Money.gainTotal(items,S);
      if(g)parts.push(h('span',{class:'gain '+(g.gain>=0?'up':'down'),id:'gain-total',textContent:`${signed(g.gain)} (${pctS(g.pct)})`}));
      const st=items.filter(i=>i.mode==='units'&&Money.isStale(i.priced,today)).length;
      if(st)parts.push(h('span',{class:'stale',textContent:st===1?'1 old price':st+' old prices'}));
    }else{
      if(nw.liabilities>0)parts.push(fmtPct(t/nw.liabilities*100)+' of debt');
      const pay=items.reduce((a,d)=>a+Money.toBase(d.payment,d.cur,d.rate,S),0);
      if(pay>0)parts.push(money(pay)+' a month');
    }
    parts.push(items.length+' '+(side==='a'?(items.length===1?'holding':'holdings'):(items.length===1?'debt':'debts')));
    sub.replaceChildren(...parts.map(p=>typeof p==='string'?h('span',{textContent:p}):p));
    if(extra)extra.update();
  };
  const changed=()=>{if(c.ex){delete c.ex;exNote.remove()}update();commit()};
  const ctx={items,changed,rerender:null};
  const renderRows=()=>{
    list.replaceChildren();
    if(c.ex)list.append(exNote);
    extra=side==='a'&&c.kind==='tfsa'?tfsaEl(c,changed):null;
    if(extra)list.append(extra.el);
    if(!items.length)list.append(h('div',{class:'empty',textContent:side==='a'?'Add what you own here, like an account, fund or property.':'Add what you owe here, like a loan or a card balance.'}));
    items.forEach(it=>list.append(side==='a'?holdingEl(it,ctx):debtEl(it,ctx)));
  };
  ctx.rerender=renderRows;
  const title=h('input',{class:'title-in',id:'node-title',value:c.title,placeholder:'Title',maxLength:40,'aria-label':'Title',oninput:e=>{c.title=e.target.value;changed()}});
  const addBtn=h('button',{class:'btn main',id:'add-item',textContent:side==='a'?'+ Add holding':'+ Add debt',onclick:()=>{
    items.push(side==='a'?hold('',{cur:S.base,mode:preset.units?'units':'simple'}):debt('',{cur:S.base}));
    changed();renderRows();
    const rows=list.querySelectorAll('.hold'),last=rows[rows.length-1];
    if(last){last.scrollIntoView({block:'nearest'});last.querySelector('input').focus()}
  }});
  let armed=false,timer;
  const del=h('button',{class:'btn danger',id:'del-node',textContent:'Delete circle',onclick:()=>{
    if(!armed){armed=true;del.textContent='Tap again to delete';del.classList.add('armed');timer=setTimeout(()=>{armed=false;del.textContent='Delete circle';del.classList.remove('armed')},2600);return}
    clearTimeout(timer);closeCard();
    const i=group.indexOf(c);if(i>-1)group.splice(i,1);
    delete S.worth.offsets[c.id];commit();
  }});
  const body=h('div',{class:'cbody'},
    h('div',{class:'chead'},h('span',{class:'dot'}),title,xBtn()),
    h('div',{class:'sum'},total,sub),list,h('div',{class:'cfoot'},addBtn,del));
  renderRows();update();
  return body;
}

// Rebuild the state from known fields only: a backup file is untrusted input.
// v1 files (budget only) keep the current net worth data; privacy and mode stay as they are on this device.
function cleanImport(d,now){
  const CODE=/^[A-Z0-9]{1,5}$/,ID=/^[a-z0-9]{1,16}$/;
  const obj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
  if(!obj(d)||!Array.isArray(d.income)||!Array.isArray(d.nodes)||!CODE.test(d.base))throw new Error('bad file');
  const used=new Set();
  const cid=v=>{const x=typeof v==='string'&&ID.test(v)&&!used.has(v)?v:uid();used.add(x);return x};
  const text=(v,max)=>String(v??'').slice(0,max);
  const list=v=>Array.isArray(v)?v.filter(obj):[];
  const cur=c=>CODE.test(c)?c:d.base;
  const pos=v=>{const x=num(v);return x>0?x:null};
  const hex=(c,fb)=>typeof c==='string'&&/^#[0-9a-f]{3,8}$/i.test(c)?c:fb;
  const day=v=>typeof v==='string'&&/^\d{4}-\d\d-\d\d$/.test(v)?v:null;
  const offsets=(src,keys)=>{
    const o={};
    if(obj(src))for(const k of keys)if(Object.hasOwn(src,k)){const v=src[k];if(Array.isArray(v)&&Number.isFinite(v[0])&&Number.isFinite(v[1]))o[k]=[v[0],v[1]]}
    return o;
  };
  const rates={};
  for(const [c,v] of Object.entries(obj(d.rates)?d.rates:{}))if(CODE.test(c)&&c!==d.base&&num(v)>0)rates[c]=num(v);
  // net worth first, so budget links can be checked against the imported debts
  let worth=null;
  if(obj(d.worth)){
    const w=d.worth;
    const holding=x=>({id:cid(x.id),name:text(x.name,200),cur:cur(x.cur),rate:pos(x.rate),mode:x.mode==='units'?'units':'simple',
      value:num(x.value),qty:num(x.qty),price:num(x.price),priced:day(x.priced),cost:pos(x.cost)});
    const owed=x=>({id:cid(x.id),name:text(x.name,200),cur:cur(x.cur),rate:pos(x.rate),balance:num(x.balance),apr:pos(x.apr),payment:pos(x.payment)});
    const circle=side=>(x,i)=>{
      const P=side==='a'?ASSET_PRESETS:DEBT_PRESETS,kind=P.some(p=>p.kind===x.kind)?x.kind:'other';
      const c={id:cid(x.id),title:text(x.title,40),kind,color:hex(x.color,P[i%P.length].color),items:list(x.items).map(side==='a'?holding:owed)};
      if(x.ex===true)c.ex=true;
      if(side==='a'&&kind==='tfsa'&&obj(x.tfsa))c.tfsa={year:Math.max(0,num(x.tfsa.year)),life:Math.max(0,num(x.tfsa.life)),
        ty:Number.isInteger(x.tfsa.ty)?x.tfsa.ty:Money.taxYear(todayISO()).start};
      return c;
    };
    const assets=list(w.assets).map(circle('a')),debts=list(w.debts).map(circle('d'));
    const snapshots=list(w.snapshots).filter(s=>day(s.date)).map(s=>{
      const o={id:cid(s.id),date:s.date,assets:num(s.assets),liabilities:num(s.liabilities),net:num(s.net),
        circles:list(s.circles).map(c=>({id:text(c.id,16),title:text(c.title,40),side:c.side==='d'?'d':'a',total:num(c.total)}))};
      if(s.ex===true)o.ex=true;
      return o;
    }).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    worth={assets,debts,offsets:offsets(w.offsets,['hub',...assets.map(c=>c.id),...debts.map(c=>c.id)]),snapshots,
      lastPrompt:typeof w.lastPrompt==='string'&&/^\d{4}-\d\d$/.test(w.lastPrompt)?w.lastPrompt:null};
  }
  const debtIds=new Set((worth||now.worth).debts.flatMap(c=>c.items.map(i=>i.id)));
  const items=v=>list(v).map(i=>{
    const o={id:cid(i.id),name:text(i.name,200),amount:num(i.amount),cur:cur(i.cur),rate:pos(i.rate)};
    if(typeof i.link==='string'&&debtIds.has(i.link))o.link=i.link;
    return o;
  });
  const income=items(d.income);
  const nodes=list(d.nodes).map((n,i)=>{
    const o={id:cid(n.id),title:text(n.title,40),color:hex(n.color,PALETTE[i%PALETTE.length]),items:items(n.items)};
    if(n.debts===true)o.debts=true;
    return o;
  });
  const lim=obj(d.tfsaLimits)?d.tfsaLimits:{};
  const state={v:VERSION,mode:now.mode,privacy:now.privacy,base:d.base,rates,income,nodes,
    offsets:offsets(d.offsets,['hub',...nodes.map(n=>n.id)]),
    tfsaLimits:worth?{annual:pos(lim.annual)??TFSA_LIMITS.annual,lifetime:pos(lim.lifetime)??TFSA_LIMITS.lifetime}:now.tfsaLimits,
    worth:worth||now.worth};
  return {state,hadWorth:!!worth};
}

/* ---------- settings ---------- */
function buildSettings(){
  const list=h('div',{class:'list'});
  let dataMsg='';
  const render=()=>{
    list.replaceChildren();
    list.append(
      h('div',{class:'sec',textContent:'Main currency'}),
      h('input',{class:'f',id:'base',value:S.base,maxLength:5,'aria-label':'Main currency code',style:'width:96px;text-transform:uppercase',onchange:e=>{
        const nb=(e.target.value||'').trim().toUpperCase()||S.base,old=S.base;
        if(nb===old)return;
        const all=allItems();
        all.forEach(i=>{if(i.cur===old)i.cur=nb});
        delete S.rates[nb];S.base=nb;
        // items that were foreign keep their code; the old main currency is now foreign
        commit();render();
      }}),
      h('div',{class:'sec',textContent:'Exchange rates'}),
      h('div',{class:'note',textContent:`Type what 1 unit of each currency is worth in ${S.base}. These are starting guesses you update by hand. A single item can override its own rate inside its card.`})
    );
    Object.keys(S.rates).forEach(code=>{
      list.append(h('div',{class:'srow'},
        h('input',{class:'f',value:code,maxLength:5,'aria-label':'Currency code',style:'text-transform:uppercase',onchange:e=>{
          const nc=(e.target.value||'').trim().toUpperCase();
          if(!nc||nc===code||nc===S.base){render();return}
          S.rates[nc]=S.rates[code];delete S.rates[code];
          allItems().forEach(i=>{if(i.cur===code)i.cur=nc});
          commit();render();
        }}),
        h('span',{textContent:'='}),
        h('input',{class:'f num',value:S.rates[code],inputMode:'decimal','aria-label':'Rate in '+S.base,oninput:e=>{S.rates[code]=num(e.target.value)||1;commit()}}),
        h('button',{class:'del',textContent:'✕','aria-label':'Remove currency',onclick:()=>{
          delete S.rates[code];
          allItems().forEach(i=>{if(i.cur===code)i.cur=S.base});
          commit();render();
        }})));
    });
    list.append(h('div',null,h('button',{class:'btn',id:'add-cur',textContent:'+ Add currency',onclick:()=>{
      let c='NEW',n=1;while(S.rates[c]||c===S.base)c='NEW'+(++n);
      S.rates[c]=1;save();render();
    }})));
    const limit=(label,id,key)=>h('label',{class:'tf-field'},h('span',{textContent:label}),
      amtInput({id,value:S.tfsaLimits[key],oninput:e=>{S.tfsaLimits[key]=Math.max(0,num(e.target.value));commit()}}));
    list.append(
      h('div',{class:'sec',textContent:'TFSA limits'}),
      h('div',{class:'note',textContent:'Defaults are R46,000 per tax year and R500,000 lifetime. Change them here if the rules change.'}),
      h('div',{class:'tf-in'},limit('Per tax year','lim-annual','annual'),limit('Lifetime','lim-life','lifetime')));
    let armed=false,t;
    const fresh=h('button',{class:'btn danger',style:'margin-left:0',id:'fresh',textContent:'Start fresh',onclick:()=>{
      if(!armed){armed=true;fresh.textContent='Tap again to wipe';fresh.classList.add('armed');t=setTimeout(()=>{armed=false;fresh.textContent='Start fresh';fresh.classList.remove('armed')},2600);return}
      clearTimeout(t);Object.assign(S,{income:[],nodes:[],offsets:{},worth:emptyWorth()});lastKey='';commit();render();
    }});
    const file=h('input',{type:'file',accept:'.json,application/json',id:'import-file',hidden:true,onchange:async e=>{
      const f=e.target.files[0];if(!f)return;
      try{
        if(f.size>2e6)throw new Error('too big');
        const r=cleanImport(JSON.parse(await f.text()),S);
        S=r.state;lastKey='';commit();
        dataMsg=r.hadWorth?'Backup imported.':'Budget imported. This older backup has no net worth data, so yours was kept.';
      }catch(err){dataMsg='That file is not a valid Moneymap backup. Nothing was changed.'}
      render();
    }});
    let importArmed=false,importTimer;
    const importBtn=h('button',{class:'btn',id:'import',textContent:'Import backup',onclick:()=>{
      if(!importArmed){importArmed=true;importBtn.textContent='Tap again to replace all';importBtn.classList.add('danger','armed');importBtn.style.marginLeft='0';importTimer=setTimeout(()=>{importArmed=false;importBtn.textContent='Import backup';importBtn.classList.remove('danger','armed')},2600);return}
      clearTimeout(importTimer);importArmed=false;importBtn.textContent='Import backup';importBtn.classList.remove('danger','armed');
      file.click();
    }});
    list.append(
      h('div',{class:'sec',textContent:'Layout'}),
      h('div',{class:'note',textContent:'Drag any circle to move it. This puts them all back in their original spots.'}),
      h('div',null,h('button',{class:'btn',id:'reset-layout',textContent:'Reset layout',onclick:()=>{S.offsets={};commit();fit()}})),
      h('div',{class:'sec',textContent:'Data'}),
      h('div',{class:'note',textContent:'Everything is saved in this browser only. The example data is made up. Export a backup file to keep a copy or move to another device. Importing replaces everything here.'}),
      h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},
        h('button',{class:'btn',id:'export',textContent:'Export backup',onclick:exportData}),importBtn,file),
      h('div',{class:'note',id:'data-msg',role:'status',textContent:dataMsg}),
      h('div',{class:'sec',textContent:'Examples'}),
      h('div',{class:'note',textContent:'Net worth examples use invented South African figures and are marked "example" on the map.'}),
      h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},
        hasExamples()
          ?h('button',{class:'btn',id:'clear-ex',textContent:'Clear examples',onclick:()=>{clearExamples();render()}})
          :h('button',{class:'btn',id:'add-ex',textContent:'Add net worth examples',onclick:()=>{addExamples();render()}}),
        h('button',{class:'btn',id:'sample',textContent:'Load example budget',onclick:()=>{const b=sample();Object.assign(S,{income:b.income,nodes:b.nodes,offsets:{}});lastKey='';commit();render()}})),
      h('div',{class:'note',textContent:'Start fresh wipes your budget and net worth. Currency and TFSA settings stay.'}),
      h('div',null,fresh)
    );
  };
  render();
  return h('div',{class:'cbody'},
    h('div',{class:'chead'},h('span',{class:'dot'}),h('h2',{class:'title-in',textContent:'Settings'}),h('button',{class:'x',id:'close',textContent:'✕','aria-label':'Close',onclick:()=>closeCard()})),
    h('div',{style:'height:10px'}),list);
}

/* ---------- wiring ---------- */
$('fit').onclick=fit;
$('gear').onclick=()=>openCard({kind:'settings'});
$('m-budget').onclick=()=>setMode('budget');
$('m-worth').onclick=()=>setMode('worth');
$('add').onclick=()=>{
  if(S.mode==='worth'){openCard({kind:'add'});return}
  const used=new Set(S.nodes.map(n=>n.color));
  const color=PALETTE.find(c=>!used.has(c))||PALETTE[S.nodes.length%PALETTE.length];
  const n={id:uid(),title:'New expense',color,items:[]};
  S.nodes.push(n);commit();
  requestAnimationFrame(()=>{
    const body=openCard({kind:'node',id:n.id});
    setTimeout(()=>{const t=body.querySelector('#node-title');if(t){t.focus();t.select()}},480);
  });
};
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{renderMap();fit()},120)});
renderMap();
</script>
</body>
